name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  cancel-superseded-merge-groups:
    name: Cancel superseded merge group runs
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          persist-credentials: false

      - name: Show the checked-out commit
        env:
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          echo "checked-out=$(git rev-parse HEAD) group-head=${GITHUB_SHA} base-ref=${BASE_REF} base-sha=${BASE_SHA}"
          git ls-remote origin "${BASE_REF}"
          git log --format='%H %s' -1

      - name: Cancel superseded merge group runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: >-
          python3 scripts/nvx.py cancel-superseded-merge-groups
          --repository "${GITHUB_REPOSITORY}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --run-id "${GITHUB_RUN_ID}"
          --ref "${MERGE_GROUP_REF}"
          --summary "${GITHUB_STEP_SUMMARY}"
  probe:
    name: Required status check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record the event
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
          MERGE_GROUP: ${{ toJSON(github.event.merge_group) }}
        run: |
          echo "event=${EVENT_NAME} ref=${GITHUB_REF} sha=${GITHUB_SHA} actor=${GITHUB_ACTOR} run=${GITHUB_RUN_ID}"
          echo "${MERGE_GROUP}"
          git log --format='%H parents=%P %s' -6 "${GITHUB_SHA}"
          echo "secret-present=$([[ -n "${PROBE_SECRET}" ]] && echo yes || echo no)"

      - name: Wait and watch the queue branches
        if: github.event_name == 'merge_group'
        run: |
          minutes=$(cat probe-minutes.txt)
          for i in $(seq 1 "${minutes}"); do
            echo "== $(date -u +%H:%M:%S)"
            git ls-remote origin 'refs/heads/gh-readonly-queue/*' 'refs/heads/main'
            sleep 60
          done